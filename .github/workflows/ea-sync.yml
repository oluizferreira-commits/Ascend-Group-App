# Free scheduled EA FC sync: calls the app every hour.
# Configure in GitHub → Settings → Secrets and variables → Actions:
#   Variable APP_URL            (e.g. https://ascend-fc.vercel.app)
#   Secret   SYNC_CRON_SECRET   (same value as in the hosting environment)
name: EA FC sync
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger sync
        env:
          APP_URL: ${{ vars.APP_URL }}
          SECRET: ${{ secrets.SYNC_CRON_SECRET }}
        run: |
          # Tolerate stray whitespace/newlines and a trailing slash pasted into the settings.
          APP_URL="$(printf '%s' "$APP_URL" | tr -d '[:space:]')"; APP_URL="${APP_URL%/}"
          SECRET="$(printf '%s' "$SECRET" | tr -d '[:space:]')"; SECRET="${SECRET#SYNC_CRON_SECRET=}"
          if [ -z "$APP_URL" ] || [ -z "$SECRET" ]; then
            echo "APP_URL/SYNC_CRON_SECRET not configured yet — skipping."; exit 0
          fi
          code=$(curl -sS -o body.txt -w "%{http_code}" --max-time 120 -H "Authorization: Bearer $SECRET" "$APP_URL/api/integrations/ea-fc/sync" || echo 000)
          cat body.txt 2>/dev/null; echo
          if [ "$code" = "401" ]; then
            # The app also syncs by itself on visits, so a wrong secret is a warning, not an hourly failure e-mail.
            echo "::warning::SYNC_CRON_SECRET does not match the value configured on the hosting (HTTP 401). Update the repository secret."
            exit 0
          fi
          [ "$code" = "200" ] || { echo "::error::Sync endpoint returned HTTP $code"; exit 1; }
